<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENEI KOTSU — A4 Renderer</title>
<style>
:root{--navy:#173154;--red:#b42318;--blue:#2458a6;--gold:#b88928;--line:#cfd8e4;--scale:1}
*{box-sizing:border-box}html,body{margin:0;background:#27313d;font-family:Tahoma,Arial,sans-serif;color:#172033}.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid #d7dee8}.toolbar strong{color:var(--navy)}.toolbar span{font-size:12px;color:#667085}.toolbar button{border:0;border-radius:9px;padding:9px 15px;background:var(--navy);color:#fff;font:700 13px Tahoma;cursor:pointer}.canvas{min-height:calc(100vh - 56px);padding:22px;display:flex;justify-content:center;align-items:flex-start}.page{width:210mm;height:297mm;overflow:hidden;background:#fff;box-shadow:0 18px 55px rgba(0,0,0,.35);padding:8mm}.content{width:100%;transform-origin:top left}
.head{display:flex;align-items:center;gap:3mm;padding-bottom:2mm;border-bottom:.7mm solid var(--navy)}.head img{width:24mm;height:auto}.company{display:grid;gap:.3mm}.company b{font-size:13pt;color:var(--navy)}.company span{font-size:6.5pt;color:#42526a}.title{display:flex;align-items:baseline;gap:4mm;padding:2mm 0}.title h1{margin:0;font-size:21pt;letter-spacing:2mm;color:var(--navy)}.title span{font-size:8pt;font-weight:700;color:#24364f;letter-spacing:.5mm}.info{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.2fr) minmax(0,1.05fr);gap:1.5mm;margin-bottom:1.5mm;align-items:stretch}.info>div{min-width:0;padding:1.6mm 2mm;border:1px solid #dce3eb;border-radius:1.8mm;background:#f3f6f9}.cap{display:block;margin-bottom:.5mm;font-size:7.5pt;font-weight:700;color:#24364f;letter-spacing:.15mm}.info b{display:block;margin-bottom:1mm;font-size:9pt;overflow-wrap:anywhere}.customer b{white-space:normal;line-height:1.35}.infoLine{display:grid;grid-template-columns:25mm minmax(0,1fr);gap:1.5mm;align-items:baseline;margin-bottom:1mm}.infoLine:last-child{margin-bottom:0}.infoLine .cap,.infoLine b{margin:0;line-height:1.25}.infoLine .cap{white-space:nowrap}.infoLine .cap::after{content:' :'}.infoLine b{min-width:0;line-height:1.25;white-space:nowrap;overflow-wrap:normal}.notice{margin-bottom:1.5mm;padding:1mm 1.5mm;border:1px solid #efcbc7;border-radius:1.5mm;background:#fff8f7;color:var(--red);font-size:7.5pt;font-weight:700;text-align:center;white-space:nowrap}
table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{border:1px solid var(--line);padding:1.2mm 1.4mm;font-size:8pt;line-height:1.25;vertical-align:top;overflow-wrap:anywhere}th{background:#eaf0f6;color:#24364f;font-size:7.5pt;text-align:left}th:nth-child(n+3),td.num{text-align:right}.date{width:13%}.detail{width:48%}.net{width:12%}.qty{width:9%}.total{width:18%}.blueText{color:var(--blue)}.redText{color:var(--red)}.bus{padding:1mm 1.5mm;border:1px solid #dec990;background:#f5ead0;text-align:center;font-size:7pt;font-weight:700}.rate{margin-top:1.3mm;padding:1mm 1.5mm;border:1px solid #dce3eb;border-radius:1.5mm;background:#f8fafc;color:#24364f;font-size:7.5pt;font-weight:700;text-align:center}
.moneyGrid{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm;margin-top:1.3mm}.money{overflow:hidden;border:1px solid #d4dce6;border-radius:2mm}.money.jpy{border-left:1.3mm solid var(--red)}.money.thb{border-left:1.3mm solid var(--blue)}.moneyHead,.moneyLine{display:flex;justify-content:space-between;align-items:center;gap:2mm;padding:1.5mm 2mm;border-bottom:1px solid #e1e6ed}.moneyLine:last-child{border-bottom:0}.moneyHead{background:#f3f6f9}.moneyHead small,.moneyLine span{font-size:8pt;font-weight:700}.moneyHead b{font-size:12pt}.moneyLine b{font-size:9pt}.moneyLine em{font-size:7pt;font-style:normal;color:#344054}.jpy b{color:var(--red)}.thb b{color:var(--blue)}
.banks{display:grid;grid-template-columns:1.05fr .95fr;gap:1.5mm;margin-top:1.5mm}.banks>div{padding:1.5mm 2mm;border:1px solid #d7dee7;border-left:1.2mm solid var(--gold);border-radius:1.8mm;font-size:7.5pt;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}.banks h3,.cancel h3{margin:0 0 .8mm;font-size:8pt;color:#24364f}.cancel{margin-top:1.5mm;padding:1.4mm 2mm;border:1px solid #e6c2be;border-radius:1.8mm;background:#fff9f8;color:#9f2d25;font-size:7pt;font-weight:700;line-height:1.25;white-space:pre-wrap}
.empty{padding:40px;text-align:center;color:#667085}
.content{font-family:var(--body-family,Tahoma),sans-serif;color:var(--body-color,#172033);font-size:var(--body-size,10px)}.company{font-family:var(--company-family,Tahoma),sans-serif;color:var(--company-color,#173154)}.company b{font-size:var(--company-size,17px)}.title{font-family:var(--title-family,Tahoma),sans-serif;color:var(--title-color,#173154)}.title h1{font-size:var(--title-size,26px)}.info{font-family:var(--info-family,Tahoma),sans-serif;color:var(--info-color,#172033)}.info b{font-size:var(--info-size,12px)}.notice{font-family:var(--notice-family,Tahoma),sans-serif;color:var(--notice-color,#b42318);font-size:var(--notice-size,10px)}table{font-family:var(--table-family,Tahoma),sans-serif;color:var(--table-color,#172033)}th,td{font-size:var(--table-size,10.5px)}.money.jpy{font-family:var(--jpy-family,Tahoma),sans-serif}.money.jpy b{font-size:var(--jpy-size,16px);color:var(--jpy-color,#b42318)}.money.thb{font-family:var(--thb-family,Tahoma),sans-serif}.money.thb b{font-size:var(--thb-size,16px);color:var(--thb-color,#2458a6)}.banks{font-family:var(--bank-family,Tahoma),sans-serif;color:var(--bank-color,#172033)}.banks>div{font-size:var(--bank-size,10px)}.cancel{font-family:var(--cancel-family,Tahoma),sans-serif;color:var(--cancel-color,#a9322b);font-size:var(--cancel-size,9px)}
/* V13 acceptance polish: stronger section boundaries in screen and PDF output. */
.info>div{border:3px solid #3a4152;border-radius:1.4mm}.notice{border:3px solid #a4524b;border-radius:1.4mm}
table{border:3px solid #3a4152}th,td{border-color:#526072;border-width:2px}.bus{border:3px solid #876d33}.rate{border:3px solid #3a4152;border-radius:1.4mm}
.money{border-width:3px;border-style:solid;border-radius:1.4mm}.money.thb{border-color:#4a73ae}.money.jpy{border-color:#bd4b43}.moneyHead,.moneyLine{border-bottom-color:#6d7888;border-bottom-width:2px}
.moneyLine{display:grid;grid-template-columns:minmax(28mm,auto) 1fr;gap:1.5mm;align-items:center}.moneyLine span{white-space:nowrap}.moneyLine b{text-align:right}.moneyLine em{grid-column:1/-1;margin-top:-1mm}
.banks>div{border:3px solid #876d33;border-left-width:1.2mm;border-radius:1.4mm}.cancel{border:3px solid #a4524b;border-radius:1.4mm}
@page{size:A4 portrait;margin:0}@media print{html,body{width:210mm;height:297mm;background:#fff}.toolbar{display:none!important}.canvas{display:block;min-height:0;padding:0}.page{width:210mm;height:297mm;margin:0;padding:8mm;box-shadow:none}}
</style>
</head>
<body>
<div class="toolbar"><div><strong>SENEI KOTSU · A4 Renderer</strong><br><span id="status">Waiting for Invoice data…</span></div><button type="button" onclick="printA4()">Print / Save PDF</button></div>
<main class="canvas"><section class="page" id="page"><div class="content" id="content"><div class="empty">กรุณาเปิด Renderer จากปุ่ม Print ใน SENEI KOTSU</div></div></section></main>
<script>
const $=id=>document.getElementById(id);const fmt=n=>Math.round(Number(n||0)).toLocaleString('en-US');const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const nl=s=>esc(s).replace(/\n/g,'<br>');const cleanNotice=s=>String(s??'').trim().replace(/^\*\*\s*/,'').replace(/\s*\*\*$/,'');
function dateText(v){if(!v)return '—';const d=new Date(v+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(',','')}
function dueText(v){if(!v)return '';const d=new Date(v+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase().replace(',','')}
function effectiveNo(it){return Number(it.effectiveNo??it.no??0)}
function applyTypography(t={}){const root=document.documentElement;Object.entries(t).forEach(([k,v])=>{if(!v)return;root.style.setProperty(`--${k}-family`,`'${String(v.family||'Tahoma').replace(/'/g,'')}'`);root.style.setProperty(`--${k}-size`,Number(v.size||10)+'px');root.style.setProperty(`--${k}-color`,v.color||'#172033')})}
function renderPayload(payload){const d=payload.data||payload;const items=payload.items||d.items||[];const logo=payload.logo||'';applyTypography(d.typography);const total=items.reduce((s,it)=>s+Number(it.net||0)*effectiveNo(it),0);const rate=Number(d.rate||0),thb=total*rate,pct=Math.max(0,Math.min(100,Number(d.depositPct||0)));const depJ=Math.round(total*pct/100),finJ=total-depJ,depT=Math.round(depJ*rate),finT=Math.round(finJ*rate);
const rows=items.map(it=>{const no=effectiveNo(it),sum=Number(it.net||0)*no,cls=it.style==='blue'?'blueText':it.style==='red'?'redText':'';return `<tr><td>${nl(it.date)}</td><td class="${cls}">${nl(it.detail)}</td><td class="num">${Number(it.net||0)?fmt(it.net):'—'}</td><td class="num">${no?fmt(no):'—'}</td><td class="num">${sum?fmt(sum):'—'}</td></tr>`}).join('');
const money=d.useDeposit?`<section class="moneyGrid"><div class="money thb"><div class="moneyHead"><small>THAI BAHT · 100%</small><b>THB ${fmt(thb)}</b></div><div class="moneyLine"><span>DEPOSIT ${fmt(pct)}%</span><b>= THB ${fmt(depT)}</b><em>${d.depositDue?'DUE '+dueText(d.depositDue):''}</em></div><div class="moneyLine"><span>${esc(d.finalText)} ${fmt(100-pct)}%</span><b>= THB ${fmt(finT)}</b><em></em></div></div><div class="money jpy"><div class="moneyHead"><small>JAPANESE YEN · 100%</small><b>JPY ${fmt(total)}</b></div><div class="moneyLine"><span>DEPOSIT ${fmt(pct)}%</span><b>= JPY ${fmt(depJ)}</b><em>${d.depositDue?'DUE '+dueText(d.depositDue):''}</em></div><div class="moneyLine"><span>${esc(d.finalText)} ${fmt(100-pct)}%</span><b>= JPY ${fmt(finJ)}</b><em></em></div></div></section>`:`<section class="moneyGrid"><div class="money thb"><div class="moneyHead"><small>THAI BAHT REFERENCE</small><b>THB ${fmt(thb)}</b></div></div><div class="money jpy"><div class="moneyHead"><small>JAPANESE YEN TOTAL</small><b>JPY ${fmt(total)}</b></div></div></section>`;
$('content').innerHTML=`<header class="head">${logo?`<img src="${logo}" alt="SENEI KOTSU">`:''}<div class="company"><b>SENEI KOTSU Co., Ltd</b><span>JAPAN ASSOCIATION OF TRAVEL AGENTS MEMBER</span><span>TOKYO GOVERNOR'S REGISTERED TRAVEL AGENCY NO. 2-7928 · 〒160-0022</span><span>4-1-22 SHINJUKU, SHINJUKU-KU, TOKYO · TEL 03-6709-8156</span></div></header><div class="title"><h1>請求書</h1><span>INVOICE</span></div><section class="info"><div class="customer"><small class="cap">BILL TO / CUSTOMER</small><b>${nl(d.customer)||'—'}</b></div><div><div class="infoLine"><small class="cap">TOUR NAME</small><b>${esc(d.tname)||'—'}</b></div><div class="infoLine"><small class="cap">TOUR DATE</small><b>${esc(d.tdate)||'—'}</b></div><div class="infoLine"><small class="cap">NO. OF PAX</small><b>${esc(d.pax)||'—'}</b></div></div><div><div class="infoLine"><small class="cap">DATE OF ISSUE</small><b>${dateText(d.issueDate)}</b></div><div class="infoLine"><small class="cap">INVOICE NO.</small><b>${esc(d.invoiceNo)||'—'}</b></div></div></section><div class="notice">${esc(cleanNotice(d.notice).replace(/\s*\n+\s*/g,' '))}</div><table><colgroup><col class="date"><col class="detail"><col class="net"><col class="qty"><col class="total"></colgroup><thead><tr><th>DATE</th><th>SERVICE DETAIL</th><th>NET</th><th>NO.</th><th>TOTAL (JPY)</th></tr></thead><tbody>${rows}</tbody></table><div class="bus">${esc(d.busNote)}</div><div class="rate">${esc(d.rateNote)} · 1 JPY = ${esc(d.rate)} THB</div>${money}<section class="banks"><div><h3>PAYMENT INFORMATION</h3>${nl(d.thBank)}</div><div><h3>JAPANESE BANK DETAILS</h3>${nl(d.jpBank)}</div></section><section class="cancel"><h3>CANCELLATION POLICY</h3>${nl(d.cancel)}</section>`;
requestAnimationFrame(()=>{fitA4();$('status').textContent=`Ready · ${items.length} Items · Scale ${$('page').dataset.scale}`});}
function fitA4(){const page=$('page'),content=$('content');content.style.transform='none';content.style.width='100%';const cs=getComputedStyle(page);const maxH=page.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),natural=content.scrollHeight;const scale=Math.min(1,maxH/Math.max(1,natural));content.style.width=(100/scale)+'%';content.style.transform=`scale(${scale})`;page.dataset.scale=Math.round(scale*100)+'%';return scale}
function printA4(){fitA4();requestAnimationFrame(()=>window.print())}
window.addEventListener('message',e=>{if(e.data?.type==='senei-render-invoice')renderPayload(e.data.payload)});window.addEventListener('beforeprint',fitA4);window.addEventListener('resize',fitA4);window.opener?.postMessage({type:'senei-a4-renderer-ready'},'*');
try{const saved=sessionStorage.getItem('senei_a4_payload_v1');if(saved)renderPayload(JSON.parse(saved))}catch(e){}
</script>
</body>
</html>
