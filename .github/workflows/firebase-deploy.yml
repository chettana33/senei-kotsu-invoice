name: Firebase Deploy — cgman/taicho-monitor (functions)

on:
  workflow_dispatch:
    inputs:
      codebase:
        description: codebase ที่จะ deploy (cgman-monitor | taicho-monitor | all)
        type: choice
        options: [cgman-monitor, taicho-monitor, all]
        required: true
        default: taicho-monitor

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy-senei
  cancel-in-progress: false

env:
  PROJECT: phathiao-cloud-2026
  FIREBASE_TOOLS: 15.28.1
  WIF_PROVIDER: projects/146015452197/locations/global/workloadIdentityPools/github/providers/github-oidc
  SA_EMAIL: firebase-gha-deploy@phathiao-cloud-2026.iam.gserviceaccount.com
  # runtime env .env ต่างกันต่อ codebase (GMAIL_* กับ SHEETS_*) — LINE_* เหมือนกัน
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
  SHEETS_CLIENT_ID: ${{ secrets.SHEETS_CLIENT_ID }}
  SHEETS_CLIENT_SECRET: ${{ secrets.SHEETS_CLIENT_SECRET }}
  SHEETS_REFRESH_TOKEN: ${{ secrets.SHEETS_REFRESH_TOKEN }}
  LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
  LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
  LINE_USER_IDS: ${{ secrets.LINE_USER_IDS }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Node 22.23.0/24.17.0 มีบั๊ก http.Agent ทำ WIF auth พัง — pin ≥22.23.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: เตรียม venv + deps + .env (loop codebase)
        env:
          INPUT_CB: ${{ github.event.inputs.codebase }}
        run: |
          set -euo pipefail
          case "$INPUT_CB" in
            cgman-monitor) CBS="cgman-monitor" ;;
            taicho-monitor) CBS="taicho-monitor" ;;
            all) CBS="cgman-monitor taicho-monitor" ;;
            *) echo "unknown codebase: $INPUT_CB"; exit 1 ;;
          esac
          echo "codebases: $CBS"
          for cb in $CBS; do
            dir="cloud-functions/$cb"
            python -m venv "$dir/venv"
            "$dir/venv/bin/python" -m pip install --upgrade pip
            "$dir/venv/bin/python" -m pip install -r "$dir/requirements.txt"
            echo "$PWD/$dir/venv/bin" >> "$GITHUB_PATH"
            : > "$dir/.env"
            if [ "$cb" = "cgman-monitor" ]; then
              printf 'GMAIL_CLIENT_ID=%s\n'       "$GMAIL_CLIENT_ID"       >> "$dir/.env"
              printf 'GMAIL_CLIENT_SECRET=%s\n'   "$GMAIL_CLIENT_SECRET"   >> "$dir/.env"
              printf 'GMAIL_REFRESH_TOKEN=%s\n'   "$GMAIL_REFRESH_TOKEN"   >> "$dir/.env"
            else
              printf 'SHEETS_CLIENT_ID=%s\n'      "$SHEETS_CLIENT_ID"      >> "$dir/.env"
              printf 'SHEETS_CLIENT_SECRET=%s\n'  "$SHEETS_CLIENT_SECRET"  >> "$dir/.env"
              printf 'SHEETS_REFRESH_TOKEN=%s\n'  "$SHEETS_REFRESH_TOKEN"  >> "$dir/.env"
            fi
            printf 'LINE_CHANNEL_ID=%s\n'         "$LINE_CHANNEL_ID"       >> "$dir/.env"
            printf 'LINE_CHANNEL_SECRET=%s\n'     "$LINE_CHANNEL_SECRET"   >> "$dir/.env"
            printf 'LINE_USER_IDS=%s\n'           "$LINE_USER_IDS"         >> "$dir/.env"
            test -s "$dir/.env" || { echo "FAIL: .env ของ $cb ว่าง"; exit 1; }
          done

      - id: gcp_auth
        name: Authenticate (WIF -> SA, keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      # firebase CLI ยังไม่ใช้ ADC ตรง -> ส่ง access token จาก SA impersonation (keyless, 9 ก.ย. 69)
      - name: Deploy functions (ต่อ codebase)
        env:
          INPUT_CB: ${{ github.event.inputs.codebase }}
        run: |
          set -euo pipefail
          case "$INPUT_CB" in
            all) CBS="cgman-monitor taicho-monitor" ;;
            *) CBS="$INPUT_CB" ;;
          esac
          for cb in $CBS; do
            echo "== deploy functions:$cb =="
            # set +e ก่อน: ถ้า deploy ล้ม ต้องพิมพ์ log ออกมาให้เห็นสาเหตุ (10 ก.ย. 69: set -e ทำให้ log หาย)
            set +e
            out="$(npx --yes firebase-tools@${{ env.FIREBASE_TOOLS }} deploy --only functions:$cb --project ${{ env.PROJECT }} --force 2>&1)"
            rc=$?
            set -e
            echo "$out"
            [ "$rc" -eq 0 ] || { echo "FAIL: deploy $cb ออก rc=$rc"; exit 1; }
            # กันเคส lessons #123: CI ขึ้น success แต่ตัวที่ตั้งใจ deploy ไม่ได้ขึ้น
            # ต้องเห็น "Successful update operation" ของ function ที่ตรงกับ codebase ที่ขอ
            fn="${cb//-/_}"
            echo "$out" | grep -q "Successful update operation" \
              || { echo "FAIL: ไม่พบ 'Successful update operation' ใน log ของ $cb"; exit 1; }
            echo "$out" | grep -q "$fn" \
              || { echo "FAIL: log ไม่ได้ deploy function $fn (ขอ codebase=$cb)"; exit 1; }
            echo "OK: deploy $cb -> function $fn (มี Successful update operation)"
          done

      # ไม่เชื่อ "Deploy complete!" หลอก — ดู functions:list + log จริง (rules §2; resource ชื่อ underscore)
      - name: Verify — functions:list + log
        env:
          INPUT_CB: ${{ github.event.inputs.codebase }}
        run: |
          set -euo pipefail
          out="$(npx --yes firebase-tools@${{ env.FIREBASE_TOOLS }} functions:list --project ${{ env.PROJECT }} 2>&1 || true)"
          echo "$out"
          for fn in cgman_monitor taicho_monitor; do
            echo "$out" | grep -q "$fn" || { echo "FAIL: function $fn ไม่พบใน functions:list"; exit 1; }
          done
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS }} functions:log --only cgman_monitor --project ${{ env.PROJECT }} --limit 3 || true
